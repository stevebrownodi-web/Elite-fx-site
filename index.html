<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELITE FX | Crypto Dashboard</title>
<style>
:root {
  --gold: #f4c44e;
  --bg: #080a0f;
  --panel: #131720;
  --border: #292e39;
  --text: #f5f6fa;
  --muted: #a5adbc;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
header {
  padding: 20px;
  background: #10131a;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.logo { font-size: 23px; font-weight: 900; color: var(--gold); }
.logo span { color: white; }
button, .button {
  border: 0;
  border-radius: 7px;
  padding: 12px 16px;
  font-weight: bold;
  cursor: pointer;
  background: var(--gold);
  color: #17130a;
}
button.secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: white;
}
nav {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  padding: 16px 5%;
  background: #0e1118;
}
nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
nav a:hover { color: var(--gold); }
.container { width: 90%; max-width: 1100px; margin: auto; }
.hero { padding: 35px 0 20px; }
.demo {
  display: inline-block;
  padding: 7px 10px;
  background: #332810;
  color: var(--gold);
  border-radius: 5px;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
}
h1 { font-size: clamp(27px, 5vw, 40px); margin-bottom: 8px; }
p { color: var(--muted); line-height: 1.6; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin: 22px 0;
}
.card {
  padding: 21px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  min-width: 0;
}
.label { color: var(--muted); font-size: 13px; }
.amount { font-size: 27px; font-weight: bold; margin: 10px 0; overflow-wrap: anywhere; }
.gold { color: var(--gold); }
h2 { font-size: 23px; margin-top: 35px; }
.coin { display: flex; align-items: center; gap: 12px; }
.icon {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  background: #282313; color: var(--gold); font-weight: bold;
}
.coin-name { font-weight: bold; }
.small { font-size: 12px; color: var(--muted); }
.plan { display: flex; flex-direction: column; gap: 12px; }
.plan button { margin-top: 8px; }
.notice {
  border: 1px solid #5c4920;
  background: #19160f;
  padding: 17px;
  border-radius: 10px;
  margin: 25px 0;
  font-size: 13px;
  color: #e4d8b9;
  line-height: 1.6;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 13px 7px; border-bottom: 1px solid var(--border); }
th { color: var(--muted); }
footer {
  border-top: 1px solid var(--border);
  padding: 25px 0;
  margin-top: 40px;
  font-size: 12px;
  color: var(--muted);
}
.hidden { display: none; }
input {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  background: #090c12;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: white;
}
@media(max-width: 480px) {
  header { padding: 16px; }
  .container { width: 92%; }
  th, td { padding: 11px 4px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">ELITE <span>FX</span></div>
  <button class="secondary" onclick="showNotice()">Account</button>
</header>

<nav>
  <a href="#dashboard">Dashboard</a>
  <a href="#markets">Cryptocurrencies</a>
  <a href="#plans">Plans</a>
  <a href="#history">History</a>
</nav>

<main class="container
